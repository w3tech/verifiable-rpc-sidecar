version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    target-branch: "main"
    assignees:
      - "fasashen"
      - "memekas"
      - "askolesov"
      - "Balevka"
    labels: ["dependencies", "cargo"]
    commit-message:
      prefix: "deps(cargo)"
    # Group minor/patch updates into a single PR
    groups:
      actions-security:
        applies-to: "security-updates"
        patterns: ["*"]
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    target-branch: "main"
    assignees:
      - "fasashen"
      - "memekas"
      - "askolesov"
      - "Balevka"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps(docker)"
    # Group minor/patch updates into a single PR
    groups:
      actions-security:
        applies-to: "security-updates"
        patterns: ["*"]
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    target-branch: "main"
    assignees:
      - "fasashen"
      - "memekas"
      - "askolesov"
      - "Balevka"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "deps(actions)"
    # Group minor/patch updates into a single PR
    groups:
      actions-security:
        applies-to: "security-updates"
        patterns: ["*"]
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
